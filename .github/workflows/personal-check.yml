name: SmartTube Personal Build Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Java 11 for the project's Robolectric version
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: '11'
          distribution: temurin
          cache: gradle

      - name: Test persistent history and compile Personal app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :common:testStbetaDebugUnitTest --tests '*PersonalHistoryDatabaseTest'
          ./gradlew --no-daemon :smarttubetv:assembleStpersonalDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: personal-test-reports
          path: common/build/reports/tests/
          if-no-files-found: ignore

