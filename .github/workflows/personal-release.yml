name: SmartTube Personal APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source and pinned dependencies
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Java 11 for the project's Robolectric version
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: '11'
          distribution: temurin
          cache: gradle

      - name: Configure persistent APK signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SIGNING_KEY KEY_STORE_PASSWORD ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name. See PERSONAL_SETUP.md."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/personal.jks"
          python3 - <<'PY'
          import os
          def escape(value):
              return (value.replace('\\', '\\\\').replace('\n', '\\n')
                      .replace('\r', '\\r').replace('=', '\\=').replace(':', '\\:')
                      .replace(' ', '\\ '))
          entries = {
              'storeType': 'PKCS12',
              'storeFile': os.environ['RUNNER_TEMP'] + '/personal.jks',
              'storePassword': os.environ['KEY_STORE_PASSWORD'],
              'keyAlias': os.environ['ALIAS'],
              'keyPassword': os.environ['KEY_PASSWORD'],
          }
          with open('keystore.properties', 'w', encoding='utf-8') as output:
              for key, value in entries.items():
                  output.write(key + '=' + escape(value) + '\n')
          PY

      - name: Test persistent history
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :common:testStbetaDebugUnitTest --tests '*PersonalHistoryDatabaseTest'

      - name: Build signed Personal APKs
        env:
          PERSONAL_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :smarttubetv:assembleStpersonalRelease -PpersonalVersionCode="$PERSONAL_VERSION_CODE"

      - name: Verify and prepare downloads
        run: |
          set -euo pipefail
          mkdir -p personal-apks
          for arch in armeabi-v7a arm64-v8a universal; do
            apk="smarttubetv/build/outputs/apk/stpersonal/release/SmartTube_personal_32.68-personal.${GITHUB_RUN_NUMBER}_${arch}.apk"
            "$ANDROID_HOME/build-tools/30.0.3/apksigner" verify "$apk"
            cp "$apk" "personal-apks/SmartTube-Personal-${arch}.apk"
          done
          (cd personal-apks && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload verified APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: smarttube-personal-apks
          path: personal-apks/*
          if-no-files-found: error

      - name: Remove temporary signing files
        if: always()
        run: rm -f -- keystore.properties "$RUNNER_TEMP/personal.jks"

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified APKs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --name smarttube-personal-apks --dir personal-apks

      - name: Publish direct TV downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="personal-${GITHUB_RUN_NUMBER}"
          cat > release-notes.md <<'EOF'
          Eigener Build von SmartTube 32.68 mit separater App-Kennung: SmartTube Personal.

          Installation am Fernseher: APK unter Assets herunterladen und installieren.
          Bei Unsicherheit die Universal-APK verwenden. Updates erfolgen über dieses Repository.
          Die erste Installation übernimmt den Verlauf der offiziellen App nicht automatisch.

          Wiedergabestände werden dauerhaft je Profil gespeichert und während der
          Wiedergabe alle 15 Sekunden gesichert. Angefangene Videos (ab 10 Sekunden)
          und fertige Videos werden aus Startseite, Abos und Empfehlungen ausgeblendet.
          Suche und Verlauf bleiben zum Wiederfinden zugänglich; Livestreams bleiben sichtbar.
          Nach der Wiedergabe werden Startseite und Abos bei der Rückkehr aktualisiert.
          EOF
          gh release create "$tag" personal-apks/* --target "$GITHUB_SHA" --title "SmartTube Personal ${GITHUB_RUN_NUMBER}" --notes-file release-notes.md --latest
          echo "Download: https://github.com/${GH_REPO}/releases/latest/download/SmartTube-Personal-universal.apk" >> "$GITHUB_STEP_SUMMARY"
